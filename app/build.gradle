// ParkEase – app-level build.gradle (inside the "app" folder)
// Configures the Android app: SDK versions, Java version and all libraries.

plugins {
    id 'com.android.application'
}

// The Google Services plugin reads app/google-services.json (from the Firebase console).
// It is applied only when that file exists, so the empty app still builds
// before you have connected Firebase.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('ParkEase: app/google-services.json not found – Firebase is not connected yet.')
}

android {
    namespace 'com.parkease.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.parkease.app'
        minSdk 26          // Android 8.0+ : adaptive icons + java.time date API built in
        targetSdk 35       // Android 15
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // ViewBinding: safe access to XML views without findViewById()
        viewBinding true
    }
}

dependencies {
    // ---------- AndroidX core UI ----------
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.9.3'

    // ---------- Material Design 3 ----------
    implementation 'com.google.android.material:material:1.12.0'

    // ---------- Firebase (versions controlled by the BoM) ----------
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'

    // ---------- QR code: generate + scan (ZXing) ----------
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ---------- Charts for admin analytics ----------
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ---------- Image loading (parking location photos from URLs) ----------
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // SQLite needs no dependency: android.database.sqlite is built into Android.
}
