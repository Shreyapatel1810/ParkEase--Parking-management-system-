// ParkEase – project-level build.gradle (project root)
// Declares the Gradle plugins used by the app module.
// "apply false" means: download the plugin, but let each module decide whether to use it.

plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
