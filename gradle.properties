# ParkEase – gradle.properties (project root)

# Memory given to the Gradle build process
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries (required by Material, Firebase, ZXing, MPAndroidChart)
android.useAndroidX=true

# Each module's R class only contains its own resources (faster builds)
android.nonTransitiveRClass=true
